name: Testing the runner
on:
  push:
    branches:
      - master
    paths-ignore:
      - '.github/workflows/**'
env:
  HARBOR_IMAGE_NAME: testing-image
  VERSION: latest

jobs:
  build-docker-image:
    runs-on: runner-scale-set
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Build Docker Image
        run: |
          docker build -t ${{ env.HARBOR_IMAGE_NAME }}:${{ env.VERSION }} .

      - name: Last step to check
        run: echo "🎉 This job uses runner scale set runners!"
