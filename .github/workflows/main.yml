name: Testing the runner
on:
  push:
    branches:
      - master
    paths-ignore:
      - '.github/workflows/**'
env:
  HARBOR_IMAGE_NAME: testing-image
  VERSION: latest

jobs:
  build-docker-image:
    runs-on: runner-scale-set
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Debug Info
        run: |
          echo "Node Version:"
          node --version
          echo "NPM Version:"
          npm --version
          echo "Memory Info:"
          free -h
          echo "Disk Space:"
          df -h
          echo "Docker Info:"
          docker info

      - name: Build Docker Image
        run: |
          # Add --no-cache to force fresh build
          DOCKER_BUILDKIT=0 docker build \
            --no-cache \
            --progress=plain \
            --memory=4g \
            --memory-swap=4g \
            -t ${{ env.HARBOR_IMAGE_NAME }}:${{ env.VERSION }} .
        
      - name: Show Docker Logs
        if: always()
        run: |
          docker ps -a
          docker logs $(docker ps -aq | head -n 1)

      - name: Build Docker Image
        run: |
          docker build -t ${{ env.HARBOR_IMAGE_NAME }}:${{ env.VERSION }} .

      - name: Last step to check
        run: echo "🎉 This job uses runner scale set runners!"
